# Called by release.yml (dist custom publish job) after the GitHub release is created.
# Publishes the npm installer package through trusted publishing: npmjs.com trusts
# vannt-dev/calmrun + release.yml, so no token secret is needed.
name: Publish npm

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Fetch the npm package built by dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Publish
        run: npm publish --provenance --access public ./artifacts/calmrun-npm-package.tar.gz
