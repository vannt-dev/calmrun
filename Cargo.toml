[package]
name = "calmrun"
version = "0.3.0"
edition = "2021"
rust-version = "1.95"
description = "A machine-wide queue for heavy commands, so parallel coding agents and terminals don't freeze the computer"
license = "MIT"
repository = "https://github.com/vannt-dev/calmrun"
homepage = "https://github.com/vannt-dev/calmrun"
readme = "README.md"
keywords = ["queue", "cli", "agents", "scheduler", "build"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".github/", "docs/"]

[dependencies]
clap = { version = "4.6.9", features = ["derive"] }
ctrlc = { version = "3.5.3", features = ["termination"] }
dirs = "7.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sysinfo = "0.40.4"
thiserror = "2.0.21"
toml = "1.2.2"

[target."cfg(unix)".dependencies]
libc = "0.2.191"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Power", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_Security"] }

[dev-dependencies]
tempfile = "3.27.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
